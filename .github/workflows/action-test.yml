name: Action test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tables-found:
    name: Tables become CSV files (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - id: ptp
        uses: ./
        with:
          files: .github/action-test/ok/*.pdf
          artifact-name: tables-${{ matrix.os }}
      - name: Check the outputs
        shell: bash
        run: |
          test "${{ steps.ptp.outputs.files }}" = "2"
          test "${{ steps.ptp.outputs.tables }}" = "5"
          test "${{ steps.ptp.outputs.output-dir }}" = "pdf-tables"
          test -s pdf-tables/.github/action-test/ok/ruled/page1_table1.csv
          test -s pdf-tables/.github/action-test/ok/spaced/page1_table1.csv
          grep -q 'Region,Q1,Q2' pdf-tables/.github/action-test/ok/ruled/page1_table1.csv

  pages-picked:
    name: The pages input reads only those pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: ptp
        uses: ./
        with:
          files: .github/action-test/ok/ruled.pdf
          pages: "1"
          output-dir: out
      - name: Check the outputs
        run: |
          test "${{ steps.ptp.outputs.tables }}" = "2"
          test ! -e out/.github/action-test/ok/ruled/page2_table1.csv

  no-tables-passes:
    name: A PDF with no tables passes by default
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: ptp
        uses: ./
        with:
          files: .github/action-test/none/*.pdf
      - name: Check the outputs
        run: test "${{ steps.ptp.outputs.tables }}" = "0"

  no-tables-fails:
    name: fail-if-no-tables true fails the step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: ptp
        uses: ./
        continue-on-error: true
        with:
          files: .github/action-test/none/*.pdf
          fail-if-no-tables: "true"
      - name: Check that the step failed
        run: test "${{ steps.ptp.outcome }}" = "failure"

  scanned-warns:
    name: A scanned PDF warns but passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: ptp
        uses: ./
        with:
          files: .github/action-test/scanned/*.pdf
      - name: Check the outputs
        run: test "${{ steps.ptp.outputs.scanned-files }}" = "1"

  scanned-fails:
    name: fail-on-scanned true fails the step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: ptp
        uses: ./
        continue-on-error: true
        with:
          files: .github/action-test/scanned/*.pdf
          fail-on-scanned: "true"
      - name: Check that the step failed
        run: test "${{ steps.ptp.outcome }}" = "failure"

  no-files-fails:
    name: No matching files fails the step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: ptp
        uses: ./
        continue-on-error: true
        with:
          files: does-not-exist/**/*.pdf
      - name: Check that the step failed
        run: test "${{ steps.ptp.outcome }}" = "failure"

  bad-input-fails:
    name: A bad setting fails the step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: ptp
        uses: ./
        continue-on-error: true
        with:
          files: .github/action-test/ok/*.pdf
          strategy: "guess"
      - name: Check that the step failed
        run: test "${{ steps.ptp.outcome }}" = "failure"

  set-python-version:
    name: Works with python-version set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: ptp
        uses: ./
        with:
          files: .github/action-test/ok/spaced.pdf
          python-version: "3.10"
      - name: Check the outputs
        run: test "${{ steps.ptp.outputs.tables }}" = "1"
