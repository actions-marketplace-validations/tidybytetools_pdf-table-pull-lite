name: "PDF Table Pull Lite"
description: "Pull the tables out of text PDFs into CSV files, one file per table. Shows a preview on the run page."
author: "Tidy Byte Tools"
branding:
  icon: "grid"
  color: "green"

inputs:
  files:
    description: "Which PDF files to read. Glob patterns, one per line or split by commas. ** goes into sub-folders."
    required: false
    default: "**/*.pdf"
  exclude:
    description: "Glob patterns to skip, one per line or split by commas."
    required: false
    default: |
      node_modules/**
      **/node_modules/**
      vendor/**
  output-dir:
    description: "Folder for the CSV files. Each PDF gets its own sub-folder, named after its path."
    required: false
    default: "pdf-tables"
  pages:
    description: "Pages to read in every PDF, like 1,3-5. Leave empty for all pages."
    required: false
    default: ""
  strategy:
    description: "lines (tables with borders), text (tables lined up by spaces), or auto (try lines, then text)."
    required: false
    default: "auto"
  fail-if-no-tables:
    description: "Set to true to fail when a PDF has no tables."
    required: false
    default: "false"
  fail-on-scanned:
    description: "Set to true to fail when a PDF has scanned pages with no text. By default it only warns."
    required: false
    default: "false"
  fail-if-no-files:
    description: "Fail the step when no files match. Set to false to just warn."
    required: false
    default: "true"
  artifact-name:
    description: "If set, upload the CSV files as a workflow artifact with this name."
    required: false
    default: ""
  python-version:
    description: "Python version to set up. Leave empty to use the runner's own Python (3.10 or newer)."
    required: false
    default: ""

outputs:
  files:
    description: "How many PDF files were read."
    value: ${{ steps.pull.outputs.files }}
  tables:
    description: "How many tables were saved as CSV."
    value: ${{ steps.pull.outputs.tables }}
  scanned-files:
    description: "How many PDFs have scanned pages with no text."
    value: ${{ steps.pull.outputs.scanned-files }}
  output-dir:
    description: "The folder with the CSV files."
    value: ${{ steps.pull.outputs.output-dir }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      id: setup
      if: inputs.python-version != ''
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        update-environment: false

    - name: Install PDF Table Pull Lite
      id: py
      shell: bash
      env:
        SETUP_PY: ${{ steps.setup.outputs.python-path }}
      run: |
        base=""
        for c in "$SETUP_PY" python3 python; do
          if [ -n "$c" ] && command -v "$c" >/dev/null 2>&1 && "$c" -c 'import sys; sys.exit(sys.version_info < (3, 10))' 2>/dev/null; then
            base="$c"; break
          fi
        done
        if [ -z "$base" ]; then
          echo "::error::PDF Table Pull Lite needs Python 3.10 or newer. Set the python-version input, like python-version: '3.12'."
          exit 1
        fi
        venv="$RUNNER_TEMP/pdf-table-pull-lite-venv"
        "$base" -m venv "$venv"
        if [ -x "$venv/bin/python" ]; then py="$venv/bin/python"; else py="$venv/Scripts/python.exe"; fi
        "$py" -m pip install --disable-pip-version-check -q -r "$GITHUB_ACTION_PATH/action/requirements.txt"
        echo "python=$py" >> "$GITHUB_OUTPUT"

    - name: Pull tables
      id: pull
      shell: bash
      env:
        PYTHON: ${{ steps.py.outputs.python }}
        INPUT_FILES: ${{ inputs.files }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_PAGES: ${{ inputs.pages }}
        INPUT_STRATEGY: ${{ inputs.strategy }}
        INPUT_FAIL_IF_NO_TABLES: ${{ inputs.fail-if-no-tables }}
        INPUT_FAIL_ON_SCANNED: ${{ inputs.fail-on-scanned }}
        INPUT_FAIL_IF_NO_FILES: ${{ inputs.fail-if-no-files }}
        PYTHONUTF8: "1"
        PYTHONDONTWRITEBYTECODE: "1"
      run: '"$PYTHON" "$GITHUB_ACTION_PATH/action/run.py"'

    - name: Upload CSV files
      if: inputs.artifact-name != '' && steps.pull.outputs.tables != '' && steps.pull.outputs.tables != '0' && !cancelled()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.pull.outputs.output-dir }}
        if-no-files-found: error
        include-hidden-files: true
