[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-table-pull-lite"
version = "1.1.0"
description = "Pull the tables out of a text PDF into CSV files. Runs locally."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "tidybyte"}]
requires-python = ">=3.10"
dependencies = ["pdfplumber>=0.10", "mcp>=1.2,<2"]
keywords = ["pdf", "table", "csv", "extract", "pdfplumber", "cli", "mcp", "mcp-server"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Office/Business",
]

[project.urls]
"Paid version" = "https://tidybyte.gumroad.com/l/hkxqxh"
Source = "https://github.com/tidybytetools/pdf-table-pull-lite"
Shop = "https://tidybyte.gumroad.com"

[project.scripts]
pdf-table-pull-lite = "pdf_table_pull_lite:main"
pdf-table-pull-lite-mcp = "pdf_table_pull_lite_mcp:main"

[tool.setuptools]
py-modules = ["pdf_table_pull_lite", "pdf_table_pull_lite_mcp"]
