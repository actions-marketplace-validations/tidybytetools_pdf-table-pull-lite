[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-table-pull-lite"
version = "1.2.1"
description = "Pull the tables out of a text PDF into CSV files. Runs locally. CLI and MCP server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Tidy Byte Tools"}]
requires-python = ">=3.10"
dependencies = [
  "pdfplumber>=0.10",
  "mcp>=1.10,<2",
]
keywords = ["pdf", "table", "csv", "extract", "pdf-to-csv", "pdfplumber", "cli", "mcp", "mcp-server"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Text Processing",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://tidybyte.gumroad.com/l/hkxqxh"
Source = "https://github.com/tidybytetools/pdf-table-pull-lite"
Issues = "https://github.com/tidybytetools/pdf-table-pull-lite/issues"
Changelog = "https://github.com/tidybytetools/pdf-table-pull-lite/blob/main/CHANGELOG.md"

[project.scripts]
pdf-table-pull-lite = "pdf_table_pull_lite:main"
pdf-table-pull-lite-mcp = "pdf_table_pull_lite_mcp:main"

[tool.setuptools]
py-modules = ["pdf_table_pull_lite", "pdf_table_pull_lite_mcp"]
